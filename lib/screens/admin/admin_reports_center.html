<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FreshFold Admin — Reports Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #1A5C58;
    --teal-deep: #0F423F;
    --teal-muted: #E8F2F1;
    --amber: #D4841A;
    --amber-light: #FDF3E3;
    --danger: #C0553F;
    --danger-light: #FBE9E4;
    --slate: #2C3E50;
    --muted: #64748B;
    --cream: #F5F0E8;
    --cream-dark: #EDE7D9;
    --white: #FFFFFF;
    --tab-inactive: #9AA5A3;
    --shadow-sm: 0 1px 2px rgba(15,23,34,0.05), 0 1px 1px rgba(15,23,34,0.03);
    --shadow-md: 0 12px 32px rgba(15,23,34,0.10), 0 2px 6px rgba(15,23,34,0.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--slate);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- App shell ---------- */
  .app { display: flex; min-height: 100vh; width: 100%; }
  .sidebar {
    width: 264px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: var(--cream); display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; z-index: 20; transition: transform 0.25s ease;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .brand-mark { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
  .brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 11px; font-weight: 600; color: rgba(245,240,232,0.6); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
  .nav-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,240,232,0.5); padding: 6px 12px 8px; }
  .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; margin: 2px 0; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: rgba(245,240,232,0.82); border: none; background: transparent; text-align: left; transition: background 0.15s ease, color 0.15s ease; }
  .nav-item svg { flex-shrink: 0; opacity: 0.85; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: var(--cream); }
  .nav-item.active { background: rgba(255,255,255,0.16); color: var(--cream); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  .nav-item.active svg { opacity: 1; }
  .nav-chevron { margin-left: auto; transition: transform 0.18s ease; opacity: 0.7; flex-shrink: 0; }
  .nav-group.open .nav-chevron { transform: rotate(180deg); }
  .nav-sub { display: none; flex-direction: column; margin: 2px 0 6px 20px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.14); }
  .nav-group.open .nav-sub { display: flex; }
  .nav-sub a { padding: 7px 10px; margin: 1px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: rgba(245,240,232,0.72); }
  .nav-sub a:hover { background: rgba(255,255,255,0.08); color: var(--cream); }
  .sidebar-footer { padding: 14px; border-top: 1px solid rgba(255,255,255,0.12); }
  .admin-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 11px; }
  .admin-avatar { width: 38px; height: 38px; border-radius: 999px; flex-shrink: 0; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .admin-meta { min-width: 0; flex: 1; }
  .admin-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .admin-email { font-size: 10.5px; color: rgba(245,240,232,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logout-btn { flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: var(--cream); font-size: 11px; font-weight: 700; padding: 7px 10px; border-radius: 9px; }
  .logout-btn:hover { background: rgba(255,255,255,0.12); }
  .menu-toggle { display: none; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 15; background: rgba(245,240,232,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--cream-dark); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 26px; }
  .menu-toggle { width: 36px; height: 36px; border-radius: 9999px; border: 1px solid var(--cream-dark); background: var(--white); align-items: center; justify-content: center; flex-shrink: 0; }
  .search-box { position: relative; width: 100%; max-width: 320px; }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search-box input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--cream-dark); background: var(--white); padding: 4px 12px 4px 38px; font-size: 13.5px; color: var(--slate); outline: none; box-shadow: var(--shadow-sm); }
  .search-box input:focus { border-color: var(--teal); }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .live-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--teal-muted); color: var(--teal); font-size: 11.5px; font-weight: 800; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
  .live-pill .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--teal); position: relative; }
  .live-pill .dot::after { content: ''; position: absolute; inset: 0; border-radius: 999px; background: var(--teal); animation: ping 1.6s cubic-bezier(0,0,0.2,1) infinite; }
  @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }
  .icon-btn { position: relative; width: 38px; height: 38px; border-radius: 9999px; border: 1px solid var(--cream-dark); background: var(--white); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--cream); }
  .icon-badge { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 3px; background: var(--danger); color: var(--white); border-radius: 999px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .avatar-chip { width: 38px; height: 38px; border-radius: 999px; background: var(--teal); color: var(--cream); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border: 1px solid var(--cream-dark); }

  .content { flex: 1; padding: 22px 26px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1100px; width: 100%; margin: 0 auto; }

  /* ---------- Reports Center hero (ports the JSON's "reportslist-header") ---------- */
  .reports-hero { text-align: center; padding: 18px 0 6px; }
  .reports-hero h1 { margin: 0 0 16px; font-size: 26px; font-weight: 700; color: var(--slate); }
  .reports-search { position: relative; max-width: 420px; margin: 0 auto; }
  .reports-search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .reports-search input {
    width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--cream-dark);
    background: var(--white); padding: 0 14px 0 40px; font-size: 13.5px; color: var(--slate); outline: none; box-shadow: var(--shadow-sm);
  }
  .reports-search input:focus { border-color: var(--teal); }

  /* ---------- Reports card (ports the JSON's "zi-reports-card") ---------- */
  .reports-card { background: var(--white); border: 1px solid var(--cream-dark); border-radius: 16px; box-shadow: var(--shadow-md); padding: 32px 36px; }
  .report-section { margin-bottom: 30px; }
  .report-section:last-child { margin-bottom: 0; }
  .report-section h4 { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; font-size: 15px; font-weight: 700; color: var(--slate); }
  .report-section h4 svg { color: var(--teal); flex-shrink: 0; }
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
  @media (max-width: 620px) { .report-grid { grid-template-columns: 1fr; } }
  .report-link {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 4px; border-radius: 8px; border-bottom: 1px dashed transparent;
    color: var(--teal); font-size: 13.5px; font-weight: 600;
  }
  .report-link .arrow { opacity: 0; transform: translateX(-4px); transition: opacity 0.15s ease, transform 0.15s ease; flex-shrink: 0; }
  .report-link:hover { background: var(--teal-muted); border-bottom-color: var(--teal); }
  .report-link:hover .arrow { opacity: 1; transform: translateX(0); }
  .report-link.disabled { color: var(--tab-inactive); cursor: default; }
  .report-link.disabled:hover { background: transparent; border-bottom-color: transparent; }
  .report-link.disabled .arrow { display: none; }
  .report-link .hit { display: none; }
  .report-link.hidden { display: none; }

  .no-results { text-align: center; padding: 40px 0; color: var(--muted); font-size: 13.5px; display: none; }

  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 0 9999px rgba(15,23,34,0.35); }
    .menu-toggle { display: flex; }
    .live-pill span.txt { display: none; }
    .reports-card { padding: 22px 18px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">FF</div>
      <div>
        <div class="brand-name">FreshFold</div>
        <div class="brand-sub">Admin Console</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-eyebrow">Operations</div>
      <a class="nav-item" href="admin_dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" href="admin_orders.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
        <span>Orders</span>
      </a>

      <div class="nav-group" id="membersGroup">
        <button class="nav-item nav-group-toggle" data-target="membersGroup">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.7 13.8c2.7.4 4.8 2.6 4.8 5.9"/></svg>
          <span>Members</span>
          <svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav-sub">
          <a href="#">All members</a>
          <a href="#">Clients</a>
          <a href="#">Vendors</a>
          <a href="#">Drivers</a>
        </div>
      </div>

      <a class="nav-item active" href="admin_reports.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Reports</span>
      </a>
      <a class="nav-item" href="admin_settings.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-card">
        <div class="admin-avatar">A</div>
        <div class="admin-meta">
          <div class="admin-name">Site Administrator</div>
          <div class="admin-email">admin@gmail.com</div>
        </div>
        <button class="logout-btn">Log out</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#8a8378" stroke-width="1.5"/><path d="M10.5 10.5l3.5 3.5" stroke="#8a8378" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Search orders, vendors, drivers…" />
        </div>
      </div>
      <div class="topbar-actions">
        <span class="live-pill"><span class="dot"></span><span class="txt">19 drivers moving</span></span>
        <button class="icon-btn" aria-label="Alerts">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span class="icon-badge">3</span>
        </button>
        <div class="avatar-chip">A</div>
      </div>
    </header>

    <main class="content">

      <!-- Hero: title + search (ports the JSON's reportslist-header) -->
      <section class="reports-hero">
        <h1>Reports Center</h1>
        <div class="reports-search">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#8a8378" stroke-width="1.5"/><path d="M10.5 10.5l3.5 3.5" stroke="#8a8378" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" id="reportSearch" placeholder="Search reports…" />
        </div>
      </section>

      <!-- Report categories (ports the JSON's zi-reports-card with per-category sections) -->
      <section class="reports-card" id="reportsCard"></section>
      <div class="no-results" id="noResults">No reports match your search.</div>

    </main>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===== Nav: collapsible group + mobile drawer ===== */
  document.querySelectorAll('.nav-group-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById(btn.dataset.target).classList.toggle('open');
    });
  });
  var sidebar = document.getElementById('sidebar');
  document.getElementById('menuToggle').addEventListener('click', function () {
    sidebar.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (window.innerWidth > 900) return;
    if (!sidebar.contains(e.target) && !document.getElementById('menuToggle').contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });

  /* ===== Report categories. Icons are simple inline SVG paths, one per section. ===== */
  var ICONS = {
    ops: '<path d="M9 3H5a2 2 0 00-2 2v4M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M15 21h4a2 2 0 002-2v-4"/><circle cx="12" cy="12" r="3"/>',
    orders: '<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/>',
    money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v.01M18 14v.01"/>',
    recur: '<path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/>',
    vendor: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v11H3z"/><path d="M9 20v-6h6v6"/>',
    tax: '<path d="M4 20V10M12 20V4M20 20v-7"/>',
    driver: '<rect x="1" y="6" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/>',
    activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>'
  };

  var categories = [
    {
      title: 'Operations', icon: ICONS.ops,
      items: [
        { name: 'Vendor Load Report', href: 'admin_report_vendor_load.html' },
        { name: 'Driver Assignment Report' },
        { name: 'Peak Hours Report' }
      ]
    },
    {
      title: 'Orders', icon: ICONS.orders,
      items: [
        { name: 'Order Status Breakdown' },
        { name: 'Order History' },
        { name: 'Unassigned Orders' },
        { name: 'Cancelled Orders' },
        { name: 'Turnaround Time' },
        { name: 'Repeat Orders' }
      ]
    },
    {
      title: 'Payments & Refunds', icon: ICONS.money,
      items: [
        { name: 'Revenue Summary' },
        { name: 'Refund History' },
        { name: 'Outstanding Balances' }
      ]
    },
    {
      title: 'Recurring Pickups', icon: ICONS.recur,
      items: [
        { name: 'Recurring Pickup Schedule' }
      ]
    },
    {
      title: 'Vendor Payouts', icon: ICONS.vendor,
      items: [
        { name: 'Payout Summary' },
        { name: 'Payouts by Vendor' },
        { name: 'Vendor Commission' },
        { name: 'Vendor Onboarding' },
        { name: 'Vendor Compliance' }
      ]
    },
    {
      title: 'Taxes', icon: ICONS.tax,
      items: [
        { name: 'Tax Summary' }
      ]
    },
    {
      title: 'Drivers & Time Tracking', icon: ICONS.driver,
      items: [
        { name: 'Driver Performance' },
        { name: 'Delivery Times' },
        { name: 'Route Efficiency' },
        { name: 'Driver Earnings' }
      ]
    },
    {
      title: 'Activity', icon: ICONS.activity,
      items: [
        { name: 'Activity Logs' },
        { name: 'Alerts History' },
        { name: 'System Mails' },
        { name: 'Exception Report' },
        { name: 'Client Reviews' }
      ]
    }
  ];

  var reportsCard = document.getElementById('reportsCard');
  categories.forEach(function (cat) {
    var section = document.createElement('div');
    section.className = 'report-section';
    section.innerHTML =
      '<h4><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + cat.icon + '</svg>' + cat.title + '</h4>' +
      '<div class="report-grid"></div>';
    var grid = section.querySelector('.report-grid');
    cat.items.forEach(function (item) {
      var el = document.createElement(item.href ? 'a' : 'span');
      if (item.href) el.href = item.href;
      el.className = 'report-link' + (item.href ? '' : ' disabled');
      el.dataset.name = item.name.toLowerCase();
      el.innerHTML =
        '<span class="hit">' + item.name + '</span>' + item.name +
        '<svg class="arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      grid.appendChild(el);
    });
    reportsCard.appendChild(section);
  });

  /* ===== Search filter across all report links ===== */
  var searchInput = document.getElementById('reportSearch');
  var noResults = document.getElementById('noResults');
  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim().toLowerCase();
    var anyVisible = false;
    document.querySelectorAll('.report-section').forEach(function (section) {
      var sectionHasVisible = false;
      section.querySelectorAll('.report-link').forEach(function (link) {
        var match = !q || link.dataset.name.indexOf(q) !== -1;
        link.classList.toggle('hidden', !match);
        if (match) sectionHasVisible = true;
      });
      section.style.display = sectionHasVisible ? '' : 'none';
      if (sectionHasVisible) anyVisible = true;
    });
    reportsCard.style.display = anyVisible ? '' : 'none';
    noResults.style.display = anyVisible ? 'none' : 'block';
  });

})();
</script>
</body>
</html>
